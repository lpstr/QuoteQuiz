<h2>Quotes</h2>

<button mat-raised-button color="primary" (click)="create()">Add Quote</button>

<table mat-table [dataSource]="quotes" class="mat-elevation-z8">

  <ng-container matColumnDef="id">
    <th mat-header-cell *matHeaderCellDef>ID</th>
    <td mat-cell *matCellDef="let q">{{ q.id }}</td>
  </ng-container>

  <ng-container matColumnDef="text">
    <th mat-header-cell *matHeaderCellDef>Quote</th>
    <td mat-cell *matCellDef="let q">{{ q.text }}</td>
  </ng-container>

  <ng-container matColumnDef="author">
    <th mat-header-cell *matHeaderCellDef>Author</th>
    <td mat-cell *matCellDef="let q">{{ authorName(q.authorId) }}</td>
  </ng-container>

  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef>Actions</th>
    <td mat-cell *matCellDef="let q">
      <button mat-button color="accent" (click)="edit(q.id)">Edit</button>
      <button mat-button color="warn" (click)="delete(q.id)">Delete</button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>
